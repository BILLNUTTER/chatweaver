<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <title>WhatsChat — Find friends and connect</title>

    <meta
      name="description"
      content="Join WhatsChat to find more friends, chat with your community, and promote your business. More people are moving here—come connect with them."
    />

    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Join WhatsChat — Find friends and connect" />
    <meta
      property="og:description"
      content="Find more friends, chat with your community, and promote your business on WhatsChat. More people are moving here—come connect with them."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chatweaver-whatschat.vercel.app/" />
    <meta property="og:image" content="https://chatweaver-whatschat.vercel.app/opengraph.jpg" />
    <meta property="og:image:alt" content="WhatsChat — find friends and connect" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Join WhatsChat — Find friends and connect" />
    <meta
      name="twitter:description"
      content="Find more friends, chat with your community, and promote your business on WhatsChat. More people are moving here—come connect with them."
    />
    <meta name="twitter:image" content="https://chatweaver-whatschat.vercel.app/opengraph.jpg" />

    <!-- Icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icon-192.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme -->
    <meta name="theme-color" content="#075E54" />

    <!-- Apple Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Chat" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
